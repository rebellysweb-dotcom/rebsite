name = "rebellys"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "rebellys-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "rebellys-images"

[vars]
ENVIRONMENT = "production"
BETTER_AUTH_URL = "https://rebellys.com"
BETTER_AUTH_TRUSTED_ORIGINS = "https://rebellys.com"
# Exact public hostname of the R2 bucket (no scheme). Also set it at BUILD time (CSP/next-image).
# R2_PUBLIC_HOST = "images.example.com"

# Burst guard in front of the D1 counters (period must be 10 or 60 seconds).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Secrets (wrangler secret put <NAME>): AUTH_SECRET, RESEND_API_KEY, ADMIN_EMAIL, TURNSTILE_SECRET (optional)

# KV namespace for sessions (optional, Better Auth can use D1 instead)
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
